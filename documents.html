<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Documents — NimbusHR</title>
<link rel="icon" href="data:,">
<link href="assets/vendor/fonts/inter.css" rel="stylesheet">
<link href="assets/vendor/bootstrap/bootstrap.min.css" rel="stylesheet">
<link href="assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
<link href="assets/vendor/fontawesome/all.min.css" rel="stylesheet">
<link href="assets/vendor/aos/aos.css" rel="stylesheet">
<link href="assets/css/themes.css" rel="stylesheet">
<link href="assets/css/style.css" rel="stylesheet">
</head>
<body>

<div class="app-shell" id="appShell">
  <aside class="app-sidebar" id="appSidebar"></aside>
  <div class="sidebar-backdrop"></div>
  <div class="app-main">
    <header class="app-header" id="appHeader"></header>
    <main class="app-content">
      <div class="d-flex justify-content-between flex-wrap gap-2" id="pageHeaderMount"></div>
      <div id="kpiMount" class="row g-3 mb-4"></div>
      <div id="filterMount" class="filter-bar mb-3"></div>
      <div class="row g-3" id="docsGrid"></div>
    </main>
  </div>
</div>

<div class="modal fade" id="uploadDocModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header"><h5 class="modal-title">Upload Document</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">
        <form id="uploadDocForm">
          <div class="mb-3"><label class="form-label">Document Name</label><input class="form-control" id="docName" required></div>
          <div class="mb-3"><label class="form-label">Category</label><select class="form-select" id="docCategory"><option>Employee Documents</option><option>Policies</option><option>Contracts</option><option>Payroll Documents</option><option>Company Documents</option></select></div>
          <div class="mb-3"><label class="form-label">Expiry Date <span class="text-muted-2" style="font-weight:400;">(optional)</span></label><input type="date" class="form-control" id="docExpiry"></div>
          <div class="mb-3"><label class="form-label">File</label><input type="file" class="form-control" id="docFile" required></div>
        </form>
      </div>
      <div class="modal-footer"><button class="btn btn-light-2" data-bs-dismiss="modal">Cancel</button><button class="btn btn-primary" id="saveDocBtn">Upload</button></div>
    </div>
  </div>
</div>

<script src="assets/vendor/bootstrap/bootstrap.bundle.min.js"></script>
<script src="assets/vendor/aos/aos.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/components.js"></script>
<script src="assets/js/app.js"></script>
<script>
  renderSidebar("documents.html");
  renderHeader("Documents", ["Dashboard", "Documents"]);
</script>
<script src="assets/js/documents.js"></script>
</body>
</html>
