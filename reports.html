<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reports — NimbusHR</title>
<link rel="icon" href="data:,">
<link href="assets/vendor/fonts/inter.css" rel="stylesheet">
<link href="assets/vendor/bootstrap/bootstrap.min.css" rel="stylesheet">
<link href="assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
<link href="assets/vendor/fontawesome/all.min.css" rel="stylesheet">
<link href="assets/vendor/aos/aos.css" rel="stylesheet">
<link href="assets/css/themes.css" rel="stylesheet">
<link href="assets/css/style.css" rel="stylesheet">
</head>
<body>

<div class="app-shell" id="appShell">
  <aside class="app-sidebar" id="appSidebar"></aside>
  <div class="sidebar-backdrop"></div>
  <div class="app-main">
    <header class="app-header" id="appHeader"></header>
    <main class="app-content">
      <div class="d-flex justify-content-between flex-wrap gap-2" id="pageHeaderMount"></div>
      <div class="row g-3 mb-4" id="reportCategoryMount"></div>
      <div id="filterMount" class="filter-bar mb-3"></div>
      <div class="hrm-card">
        <div class="hrm-card-head d-flex justify-content-between align-items-center flex-wrap gap-2">
          <span id="reportTableTitle">Employee Report</span>
          <div class="d-flex gap-2 no-print">
            <button class="btn btn-sm btn-light-2" id="exportCsvBtn"><i class="bi bi-filetype-csv me-1"></i>CSV</button>
            <button class="btn btn-sm btn-light-2" id="exportXlsBtn"><i class="bi bi-file-earmark-excel me-1"></i>Excel</button>
            <button class="btn btn-sm btn-light-2" id="exportPdfBtn"><i class="bi bi-file-earmark-pdf me-1"></i>PDF</button>
            <button class="btn btn-sm btn-light-2" id="exportPrintBtn"><i class="bi bi-printer me-1"></i>Print</button>
          </div>
        </div>
        <div class="table-wrap"><table class="hrm-table" id="reportTable"></table></div>
      </div>
    </main>
  </div>
</div>

<script src="assets/vendor/bootstrap/bootstrap.bundle.min.js"></script>
<script src="assets/vendor/aos/aos.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/components.js"></script>
<script src="assets/js/app.js"></script>
<script>
  renderSidebar("reports.html");
  renderHeader("Reports", ["Dashboard", "Reports"]);
</script>
<script src="assets/js/reports.js"></script>
</body>
</html>
