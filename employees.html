<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Employees — NimbusHR</title>
<link rel="icon" href="data:,">
<link href="assets/vendor/fonts/inter.css" rel="stylesheet">
<link href="assets/vendor/bootstrap/bootstrap.min.css" rel="stylesheet">
<link href="assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
<link href="assets/vendor/fontawesome/all.min.css" rel="stylesheet">
<link href="assets/vendor/aos/aos.css" rel="stylesheet">
<link href="assets/css/themes.css" rel="stylesheet">
<link href="assets/css/style.css" rel="stylesheet">
</head>
<body>

<div class="app-shell" id="appShell">
  <aside class="app-sidebar" id="appSidebar"></aside>
  <div class="sidebar-backdrop"></div>
  <div class="app-main">
    <header class="app-header" id="appHeader"></header>
    <main class="app-content">
      <div class="d-flex justify-content-between flex-wrap gap-2" id="pageHeaderMount"></div>

      <div class="filter-bar">
        <div class="row g-2 align-items-end">
          <div class="col-md-4">
            <label class="form-label">Search</label>
            <input type="text" class="form-control" id="empSearch" placeholder="Search by name, email or ID…">
          </div>
          <div class="col-6 col-md-2">
            <label class="form-label">Department</label>
            <select class="form-select" id="empDeptFilter"><option value="">All</option></select>
          </div>
          <div class="col-6 col-md-2">
            <label class="form-label">Designation</label>
            <select class="form-select" id="empDesigFilter"><option value="">All</option></select>
          </div>
          <div class="col-6 col-md-2">
            <label class="form-label">Status</label>
            <select class="form-select" id="empStatusFilter">
              <option value="">All</option><option>Active</option><option>On Leave</option><option>Probation</option><option>Inactive</option>
            </select>
          </div>
          <div class="col-6 col-md-2 d-flex gap-2">
            <button class="btn btn-light-2 w-100" id="empResetFilters"><i class="bi bi-arrow-counterclockwise"></i> Reset</button>
          </div>
        </div>
      </div>

      <div class="hrm-card">
        <div class="hrm-card-head d-flex justify-content-between align-items-center">
          <span id="empResultCount">Employees</span>
          <button class="btn btn-sm btn-light-2" id="empExportBtn"><i class="bi bi-download me-1"></i>Export</button>
        </div>
        <div class="table-wrap">
          <table class="hrm-table">
            <thead>
              <tr>
                <th><input type="checkbox" class="form-check-input" id="empSelectAll"></th>
                <th class="sortable" data-sort="name">Employee <i class="bi bi-arrow-down-up"></i></th>
                <th class="sortable" data-sort="department">Department <i class="bi bi-arrow-down-up"></i></th>
                <th>Contact</th>
                <th class="sortable" data-sort="joiningDate">Joining Date <i class="bi bi-arrow-down-up"></i></th>
                <th>Manager</th>
                <th>Type</th>
                <th class="sortable" data-sort="status">Status <i class="bi bi-arrow-down-up"></i></th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="empTableBody"></tbody>
          </table>
        </div>
        <div class="hrm-card-body pt-0" id="empPagination"></div>
      </div>
    </main>
  </div>
</div>

<!-- ADD / EDIT EMPLOYEE MODAL -->
<div class="modal fade" id="employeeModal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="employeeModalTitle">Add Employee</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="employeeForm">
          <div class="form-section-title"><i class="bi bi-person"></i> Personal Information</div>
          <div class="row g-3">
            <div class="col-md-6"><label class="form-label">First Name <span class="required-mark">*</span></label><input class="form-control" required></div>
            <div class="col-md-6"><label class="form-label">Last Name <span class="required-mark">*</span></label><input class="form-control" required></div>
            <div class="col-md-4"><label class="form-label">Gender</label><select class="form-select"><option>Male</option><option>Female</option><option>Other</option></select></div>
            <div class="col-md-4"><label class="form-label">Date of Birth</label><input type="date" class="form-control"></div>
            <div class="col-md-4"><label class="form-label">Blood Group</label><input class="form-control" placeholder="e.g. B+"></div>
          </div>

          <div class="form-section-title"><i class="bi bi-telephone"></i> Contact Information</div>
          <div class="row g-3">
            <div class="col-md-6"><label class="form-label">Email <span class="required-mark">*</span></label><input type="email" class="form-control" required></div>
            <div class="col-md-6"><label class="form-label">Phone <span class="required-mark">*</span></label><input type="tel" class="form-control" placeholder="+91 90000 00000" required></div>
            <div class="col-md-4"><label class="form-label">City</label><input class="form-control"></div>
            <div class="col-md-4"><label class="form-label">State</label><input class="form-control"></div>
            <div class="col-md-4"><label class="form-label">Postal Code</label><input class="form-control"></div>
          </div>

          <div class="form-section-title"><i class="bi bi-briefcase"></i> Employment Information</div>
          <div class="row g-3">
            <div class="col-md-4"><label class="form-label">Department <span class="required-mark">*</span></label><select class="form-select" id="formDept" required></select></div>
            <div class="col-md-4"><label class="form-label">Designation <span class="required-mark">*</span></label><input class="form-control" required></div>
            <div class="col-md-4"><label class="form-label">Joining Date</label><input type="date" class="form-control" value="2026-09-19"></div>
            <div class="col-md-4"><label class="form-label">Reporting Manager</label><select class="form-select" id="formManager"></select></div>
            <div class="col-md-4"><label class="form-label">Employment Type</label><select class="form-select"><option>Full-Time</option><option>Contract</option><option>Intern</option></select></div>
            <div class="col-md-4"><label class="form-label">Work Location</label><input class="form-control" placeholder="e.g. Bengaluru HQ"></div>
          </div>

          <div class="form-section-title"><i class="bi bi-cash-coin"></i> Salary Information</div>
          <div class="row g-3">
            <div class="col-md-3"><label class="form-label">Basic Salary (₹)</label><input type="number" class="form-control" placeholder="45000"></div>
            <div class="col-md-3"><label class="form-label">HRA (₹)</label><input type="number" class="form-control" placeholder="18000"></div>
            <div class="col-md-3"><label class="form-label">Allowances (₹)</label><input type="number" class="form-control" placeholder="6000"></div>
            <div class="col-md-3"><label class="form-label">Payment Method</label><select class="form-select"><option>Bank Transfer</option><option>Cheque</option></select></div>
          </div>

          <div class="form-section-title"><i class="bi bi-person-lines-fill"></i> Emergency Contact</div>
          <div class="row g-3">
            <div class="col-md-4"><label class="form-label">Name</label><input class="form-control"></div>
            <div class="col-md-4"><label class="form-label">Relationship</label><input class="form-control"></div>
            <div class="col-md-4"><label class="form-label">Phone</label><input class="form-control"></div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-light-2" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-outline-primary" id="saveContinueBtn">Save & Add Another</button>
        <button type="button" class="btn btn-primary" id="saveEmployeeBtn">Save Employee</button>
      </div>
    </div>
  </div>
</div>

<!-- VIEW EMPLOYEE MODAL -->
<div class="modal fade" id="viewEmployeeModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content"><div class="modal-body p-4" id="viewEmployeeBody"></div></div>
  </div>
</div>

<script src="assets/vendor/bootstrap/bootstrap.bundle.min.js"></script>
<script src="assets/vendor/aos/aos.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/components.js"></script>
<script src="assets/js/app.js"></script>
<script>
  renderSidebar("employees.html");
  renderHeader("Employees", ["Dashboard", "Employees"]);
</script>
<script src="assets/js/employees.js"></script>
</body>
</html>
